[workspace]

[package]
name = "aep-sdk"
version = "2.8.0"
edition = "2021"
description = "AEP 2.8 Rust SDK lattice client plus dynAEP bridge"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

aep-live-entry = { path = "../../AEP-Components/live-entry/crate" }

aep-evaluation-chain = { path = "../../AEP-Components/evaluation-chain/crate" }
