[workspace]
resolver = "2"
members = [
    "AEP-Components/lattice-crypto/crate",
    "AEP-Components/lattice-channels/crate",
    "AEP-Components/agentmesh/crate",
    "AEP-Base-Node/potomitan/crate",
    "AEP-Components/lattice-memory/crate",
    "AEP-Base-Node/multi-base-node/crate",
    "AEP-Base-Node/crate",
    "AEP-Components/wasm/crate",
    "AEP-Components/conformance/crate",
    "AEP-Docks/ucb/crate",
    "AEP-Subprotocols/core",
    "AEP-Subprotocols/ui",
    "AEP-Subprotocols/commerce",
    "AEP-Subprotocols/mcp-security",
    "AEP-Subprotocols/workflows",
    "AEP-Subprotocols/rest-api",
    "AEP-Subprotocols/events",
    "AEP-Subprotocols/iac",
    "AEP-Subprotocols/coding-governance",
    "AEP-Subprotocols/cli",
    "AEP-Components/admit/crate",
    "AEP-Components/admit-writing-walls/crate",
    "AEP-Components/admit-channel-order-walls/crate",
    "AEP-Components/admit-temporal-bounds/crate",
    "AEP-Components/admit-trust-floor/crate",
    "AEP-Components/envelope-walls/crate",
    "AEP-Components/envelope/crate",
    "AEP-Components/admit-parity/crate",
    "AEP-Components/admit-opa-sole/crate",
    "AEP-Components/hyperlattice-ssot/crate",
    "AEP-Components/stream-hard-findings/crate",
    "AEP-Components/dynaep-live-crossing-e2e/crate",
    "AEP-Components/live-crossing-admit-apply/crate",
    "AEP-Components/envelope-algebra/crate",
    "AEP-Components/envelope-algebra-ci/crate",
    "AEP-Components/envelope-journals/crate",
    "AEP-Components/live-crossing-lab-off/crate",
    "AEP-Components/envelope-wrap-disabled/crate",
    "AEP-Components/live-crossing-reject-copy/crate",
    "AEP-Components/process-event-admit-walls/crate",
    "AEP-Components/no-sequential-ts-deny/crate",
    "AEP-Components/live-entry/crate",
    "AEP-Components/live-entry-ci/crate",
    "AEP-Components/evaluation-chain/crate",
]
default-members = ["AEP-Base-Node/crate"]

[workspace.package]
version = "2.8.0"
edition = "2021"
license = "Apache-2.0"
authors = ["thePM001 <thepm001@users.noreply.github.com>"]
repository = "https://github.com/thePM001/AEP-agent-element-protocol"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
# RustCrypto pure-Rust FIPS 203/204 (maintained). Replaces unmaintained pqcrypto-*.
ml-kem = { version = "0.3", features = ["getrandom"] }
ml-dsa = { version = "0.1", features = ["getrandom"] }
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1.9"
usearch = "2.26"
# Pin soundness-fixed transitive deps (RUSTSEC-2026-0190 / RUSTSEC-2026-0202).
anyhow = "1.0.103"
cxx = "1.0.195"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# PEM parsing lives in rustls-pki-types (rustls-pemfile is unmaintained).
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = "0.26"
# WASM sandbox: pin CVE-fixed line; lean features drop unmaintained fxhash (via profiling).
wasmtime = { version = "36.0.13", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
