[workspace]
resolver = "2"
members = [
    "AEP-Components/lattice-crypto/crate",
    "AEP-Components/lattice-channels/crate",
    "AEP-Components/agentmesh/crate",
    "AEP-Base-Node/potomitan/crate",
    "AEP-Components/lattice-memory/crate",
    "AEP-Base-Node/multi-base-node/crate",
    "AEP-Base-Node/crate",
    "AEP-Components/wasm/crate",
    "AEP-Components/conformance/crate",
    "AEP-Docks/ucb/crate",
    "AEP-Docks/ucb/perimeter-v1",
    "AEP-Components/admit/crate",
    "AEP-Components/admit-writing-walls/crate",
    "AEP-Components/admit-channel-order-walls/crate",
    "AEP-Components/admit-temporal-bounds/crate",
    "AEP-Components/admit-live-dock/crate",
    "AEP-Components/envelope-walls/crate",
    "AEP-Components/envelope/crate",
    "AEP-Components/live-entry/crate",
    "AEP-Components/dynAEP/crate",
    "AEP-Components/evaluation-chain/crate",
    "AEP-Components/one-live-evaluation/crate",
    "AEP-Components/dock-request-poison/crate",
    "AEP-Components/dock-line-reader/crate",
    "AEP-Components/policy-system-admit/crate",
    "AEP-Components/policy-leftover-skins/crate",
    "AEP-Components/lattice-gated-fetch/crate",
    "AEP-Components/agentmesh-local-issuance/crate",
    "AEP-Components/epscom-trust-bundle-mode/crate",
    "AEP-Components/caw-cve-demo-trees/crate",
    "AEP-Components/unbound-field-close/crate",
    "AEP-Components/base-node-pulse/crate",
    "AEP-Components/graph-engine-admit-gate/crate",
    "AEP-Components/wall-set-backpressure/crate",
    "AEP-Components/dock-post-beat-collect/crate",
]
default-members = ["AEP-Base-Node/crate"]

[workspace.package]
version = "2.8.6"
edition = "2021"
license = "Apache-2.0"
authors = ["thePM001 <thepm001@users.noreply.github.com>"]
# Public repository URL.
repository = "https://github.com/thePM001/AEP-agent-element-protocol"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
# RustCrypto pure-Rust FIPS 203/204 (maintained). Replaces unmaintained pqcrypto-*.
ml-kem = { version = "0.3", features = ["getrandom"] }
ml-dsa = { version = "0.1", features = ["getrandom"] }
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1.9"
usearch = "2.26"
# Pin soundness-fixed transitive deps (RUSTSEC-2026-0190 / RUSTSEC-2026-0202).
anyhow = "1.0.103"
cxx = "1.0.195"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["trace", "cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# PEM parsing lives in rustls-pki-types (rustls-pemfile is unmaintained).
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = "0.26"
# WASM sandbox: pin CVE-fixed line; lean features drop unmaintained fxhash (via profiling).
wasmtime = { version = "36.0.13", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
