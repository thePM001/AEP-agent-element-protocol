[package]
name = "aep-ucb"
description = "AEP 2.9 Universal Connect Bridge attach gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aep-ucb"
path = "src/main.rs"

[[bin]]
name = "aep-ucb-validate"
path = "src/bin/aep-ucb-validate.rs"

[dependencies]
aep-agentmesh = { path = "../../../../AEP-Components/agentmesh/crate" }
aep-wall-set-backpressure = { path = "../../../../AEP-Components/wall-set-backpressure/crate" }
aep-ucb-perimeter-v1 = { path = "../perimeter-v1" }
aep-egress-address = { path = "../../../../AEP-Components/egress-address/crate" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "fs", "process", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
axum.workspace = true
tower-http.workspace = true
reqwest.workspace = true
rand.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
