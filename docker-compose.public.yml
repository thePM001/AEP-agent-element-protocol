# AEP 2.8.6 public deploy alias. Prefer docker-compose.yml for new installs.
#
#   cp .env.example .env
#   docker compose -f docker-compose.public.yml up -d --build
#
# API calls: X-AEP-Setup-Token header (prefer over ?setup_token= query).

services:
  aep:
    build:
      context: .
      dockerfile: Dockerfile
    image: aep-base-node:2.8.6
    container_name: aep-base-node
    restart: unless-stopped
    ports:
      - "${UCB_PORT:-8412}:8412"
    environment:
      AEP_DATA: /data/aep
      AEP_IN_DOCKER: "1"
      AEP_LATTICE_STRICT: "1"
      AEP_SOCKET_BASE: /data/aep/sockets
      AEP_TASK_MANIFEST_DIR: /data/aep/ucb/manifests
      AEP_MANIFEST_RELOAD_INTERVAL_SECS: "0"
      UCB: "${UCB:-1}"
      UCB_PORT: "8412"
      UCB_API_KEY: "${UCB_API_KEY:-}"
      AEP_TRUST_DOMAIN: "${AEP_TRUST_DOMAIN:-aep.protocol.local}"
      AEP_COMPONENTS_FETCH: "0"
      AEP_SETUP_LLM_PROVIDER: "${AEP_SETUP_LLM_PROVIDER:-openrouter}"
      AEP_SETUP_LLM_MODEL: "${AEP_SETUP_LLM_MODEL:-anthropic/claude-sonnet-4}"
      AEP_SETUP_LLM_BASE_URL: "${AEP_SETUP_LLM_BASE_URL:-https://openrouter.ai/api/v1}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      UCB_GAP_ENGINE_URL: "${UCB_GAP_ENGINE_URL:-}"
      AEP_GAP_ENGINE_URL: "${AEP_GAP_ENGINE_URL:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - aep-data:/data/aep
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'test -S /data/aep/sockets/validation',
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  aep-data: