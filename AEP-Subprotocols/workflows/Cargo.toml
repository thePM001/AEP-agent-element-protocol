[package]
name = "aep-subprotocol-workflows"
description = "AEP Workflows subprotocol - stateless step validation"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[dependencies]
aep-subprotocol-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"