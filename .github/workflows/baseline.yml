name: baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-workspace:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: AEP-CAW/go.mod
          cache-dependency-path: AEP-CAW/go.sum
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo test --workspace
        run: cargo test --workspace

  live-set:
    name: aep-check and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: AEP-CAW/go.mod
          cache-dependency-path: AEP-CAW/go.sum
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: install libseccomp for the CAW build
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
      - name: node aep-check.mjs
        run: node aep-check.mjs
      - name: conformance runner
        run: bash AEP-Components/conformance/runner/run.sh

  format-report:
    name: format report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: AEP-CAW/go.mod
          cache: false
      # This job reports format drift and never fails the build.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check || echo "::warning::cargo fmt reports drift"
      - name: gofmt -l AEP-CAW
        run: |
          out=$(gofmt -l AEP-CAW || true)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::warning::gofmt reports drift"
          fi
