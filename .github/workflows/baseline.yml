name: baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-workspace:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo test --workspace
        run: cargo test --workspace

  live-set:
    name: aep-check and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The wrap coverage report reads YAML through the yaml package of the root workspace.
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: Wrap coverage report on the end-to-end example
        run: node AEP-Components/wrap-coverage/lib/wrap-coverage.mjs AEP-User-Experience/examples/end-to-end-run/deployment/wrap-coverage.yaml
      - name: node aep-check.mjs
        run: node aep-check.mjs
      - name: conformance runner
        run: bash AEP-Components/conformance/runner/run.sh

  typescript:
    name: TypeScript typecheck, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # The root package.json is an npm workspace over the AEP-Components TypeScript
      # and mjs packages. tsconfig.base.json holds the strict compiler settings.
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: tsc --noEmit
        run: npm run typecheck
      - name: eslint
        run: npm run lint
      - name: vitest
        run: npm test

  gap-pin:
    name: GAP byte pin and version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # GAP-OPEN-SOURCE is the one source of the profile crate, the meta schemas and
      # gap-versions.toml. AEP-Components/gap/gap-pin.txt names the GAP commit and the bytes.
      - name: byte check and version check
        run: node AEP-Components/gap/bin/check-gap-pin.mjs
      - name: read the pinned GAP commit
        id: pin
        run: |
          repo=$(awk '$1 == "gap_repository" {print $2}' AEP-Components/gap/gap-pin.txt)
          commit=$(awk '$1 == "gap_commit" {print $2}' AEP-Components/gap/gap-pin.txt)
          echo "repository=${repo#https://github.com/}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.commit }}
          path: gap-pinned
          persist-credentials: false
      - name: byte check against the pinned GAP commit
        run: node AEP-Components/gap/bin/check-gap-pin.mjs --gap gap-pinned
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # gapc of the pinned GAP commit proves every AEP reference policy and the lattice
      # policy that policy-system-admit loads against the live meta schema and the load
      # time profile walls. The AEP .cargo/config.toml sets target-dir for every build
      # started from the AEP root, so the gapc build names its own target directory.
      - name: build gapc at the pinned GAP commit
        run: >
          cargo build --locked --release -p gapc
          --manifest-path gap-pinned/packages/Cargo.toml
          --target-dir gap-pinned/packages/target
      - name: gapc check of the AEP reference policies
        run: >
          gap-pinned/packages/target/release/gapc check
          AEP-Policy-System/reference
          AEP-Policy-System/lattice-channel-mandatory.gap
          AEP-Components/gap/policies/reference

  caw-gvisor:
    name: CAW on gVisor, facts, acceptance and hostile corpus with the pinned runsc and no root
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Root is used once: the pinned package and the AppArmor profile of runsc.
      - name: install the pinned gVisor
        run: sudo bash AEP-CAWs-RustGvisor/proof/install-runsc.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: build the proof programs
        run: |
          cargo build -p aep-caw-runtime -p aep-caw-dock --examples
          cargo build -p aep-caw -p aep-caw-init
          cargo build -p aep-base-node --bin aep-base-node
      - name: gVisor facts and trace events as the runner user
        run: |
          . AEP-CAWs-RustGvisor/proof/runsc-pin.env
          bash AEP-CAWs-RustGvisor/proof/gvisor-facts.sh "$RUNSC_BIN" "${CARGO_TARGET_DIR:-rust/target}/debug/examples/caw-trace-proof"
      - name: dock acceptance against a live Base Node
        run: bash AEP-CAWs-RustGvisor/proof/dock-acceptance.sh "${CARGO_TARGET_DIR:-rust/target}/debug/aep-base-node" "${CARGO_TARGET_DIR:-rust/target}/debug/examples/caw-dock-proof"
      - name: core acceptance as the runner user
        run: |
          . AEP-CAWs-RustGvisor/proof/runsc-pin.env
          bash AEP-CAWs-RustGvisor/proof/core-acceptance.sh "$RUNSC_BIN" "${CARGO_TARGET_DIR:-rust/target}/debug/examples/caw-run-proof" AEP-CAWs-RustGvisor/aep-caw-policy/tests/fixtures/restricted.json "${CARGO_TARGET_DIR:-rust/target}/debug/aep-caw-init" "${CARGO_TARGET_DIR:-rust/target}/debug/aep-caw" AEP-CAWs-RustGvisor/proof/fixtures/egress-proof.json "${CARGO_TARGET_DIR:-rust/target}/debug/aep-base-node"
      - name: hostile corpus as the runner user
        run: |
          . AEP-CAWs-RustGvisor/proof/runsc-pin.env
          bash AEP-CAWs-RustGvisor/proof/hostile-corpus.sh "$RUNSC_BIN" "${CARGO_TARGET_DIR:-rust/target}/debug/examples/caw-run-proof" AEP-CAWs-RustGvisor/aep-caw-policy/tests/fixtures/restricted.json "${CARGO_TARGET_DIR:-rust/target}/debug/aep-caw-init"
      - name: pairing with the EDE as the runner user
        run: |
          . AEP-CAWs-RustGvisor/proof/runsc-pin.env
          bash AEP-CAWs-RustGvisor/proof/ede-pairing.sh "$RUNSC_BIN" "${CARGO_TARGET_DIR:-rust/target}/debug/examples/caw-run-proof" AEP-CAWs-RustGvisor/proof/fixtures/ede-draft-proof.json "${CARGO_TARGET_DIR:-rust/target}/debug/aep-caw-init" "$(rustc --print sysroot)"

  docker-caw:
    name: Docker image with CAW=1, a session as a user that is not root and the proof scripts inside the image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Root is used once: the AppArmor profile of runsc, which the container of the
      # CAW needs on a host that restricts user namespaces.
      - name: install the pinned gVisor
        run: sudo bash AEP-CAWs-RustGvisor/proof/install-runsc.sh
      - name: build the image, run it with CAW=1 and run the proof scripts inside it
        run: bash docker/caw-image-check.sh

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      # Format drift fails the build.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  clippy:
    name: cargo clippy --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The lint levels live in the workspace lints table of the root Cargo.toml.
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

  vectors-without-rust:
    name: conformance vectors, example third-party runner without Rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: run the vectors with no Rust toolchain on PATH
        run: |
          NODE_DIR="$(dirname "$(command -v node)")"
          env -i PATH="$NODE_DIR:/usr/bin:/bin" HOME="$HOME" sh -ec '
            if command -v cargo || command -v rustc; then
              echo "a Rust toolchain is on PATH"
              exit 1
            fi
            node AEP-Components/conformance/vectors/examples/third-party-runner/run-vectors.mjs \
              --require dock-socket,dock-request,dock-answer,mesh-mode --json
          '

  lattice-memory-wasm:
    name: Lattice Memory core for wasm32-wasip2, golden values under Wasmtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Wasmtime comes from the crate registry with the lock file of its release, so
      # the registry checksums pin every byte of it.
      - name: install Wasmtime
        run: cargo install wasmtime-cli --version 25.0.0 --locked
      - name: the core builds for wasm32-wasip2
        run: cargo test -p aep-lattice-memory-core --test wasm_build -- --ignored
      # The same file runs natively in the workspace tests. Its constants are pinned,
      # so a pass here is the proof that both targets compute the same bits.
      - name: golden values as wasm32-wasip2 under Wasmtime
        env:
          CARGO_TARGET_WASM32_WASIP2_RUNNER: wasmtime
        run: cargo test -p aep-lattice-memory-core --target wasm32-wasip2 --test golden

  lattice-memory-bench:
    name: Lattice Memory benches, dock latency with memory on against off and record cost
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: dock latency with memory on against off
        env:
          AEP_LATENCY_GATE: "1"
          AEP_LATENCY_ROUNDS: "5"
        run: cargo test --release -p aep-base-node --lib admit_latency_memory_on_vs_off -- --nocapture --test-threads=1
      - name: record cost at 2000 against 100000 attractors, short form
        run: cargo bench -p aep-lattice-memory --bench record_flat_cost_vs_n -- --short
