name: baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-workspace:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: AEP-CAW/go.mod
          cache-dependency-path: AEP-CAW/go.sum
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: cargo test --workspace
        run: cargo test --workspace

  live-set:
    name: aep-check and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: AEP-CAW/go.mod
          cache-dependency-path: AEP-CAW/go.sum
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: install libseccomp for the CAW build
        run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
      # The wrap coverage report reads YAML through the yaml package of the root workspace.
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: Wrap coverage report on the end-to-end example
        run: node AEP-Components/wrap-coverage/lib/wrap-coverage.mjs AEP-User-Experience/examples/end-to-end-run/deployment/wrap-coverage.yaml
      - name: node aep-check.mjs
        run: node aep-check.mjs
      - name: conformance runner
        run: bash AEP-Components/conformance/runner/run.sh

  typescript:
    name: TypeScript typecheck, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # The root package.json is an npm workspace over the AEP-Components TypeScript
      # and mjs packages. tsconfig.base.json holds the strict compiler settings.
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: tsc --noEmit
        run: npm run typecheck
      - name: eslint
        run: npm run lint
      - name: vitest
        run: npm test

  gap-pin:
    name: GAP byte pin and version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # GAP-OPEN-SOURCE is the one source of the profile crate, the meta schemas and
      # gap-versions.toml. AEP-Components/gap/gap-pin.txt names the GAP commit and the bytes.
      - name: byte check and version check
        run: node AEP-Components/gap/bin/check-gap-pin.mjs
      - name: read the pinned GAP commit
        id: pin
        run: |
          repo=$(awk '$1 == "gap_repository" {print $2}' AEP-Components/gap/gap-pin.txt)
          commit=$(awk '$1 == "gap_commit" {print $2}' AEP-Components/gap/gap-pin.txt)
          echo "repository=${repo#https://github.com/}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.commit }}
          path: gap-pinned
          persist-credentials: false
      - name: byte check against the pinned GAP commit
        run: node AEP-Components/gap/bin/check-gap-pin.mjs --gap gap-pinned
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # gapc of the pinned GAP commit proves every AEP reference policy and the lattice
      # policy that policy-system-admit loads against the live meta schema and the load
      # time profile walls. The AEP .cargo/config.toml sets target-dir for every build
      # started from the AEP root, so the gapc build names its own target directory.
      - name: build gapc at the pinned GAP commit
        run: >
          cargo build --locked --release -p gapc
          --manifest-path gap-pinned/packages/Cargo.toml
          --target-dir gap-pinned/packages/target
      - name: gapc check of the AEP reference policies
        run: >
          gap-pinned/packages/target/release/gapc check
          AEP-Policy-System/reference
          AEP-Policy-System/lattice-channel-mandatory.gap
          AEP-Components/gap/policies/reference

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: AEP-CAW/go.mod
          cache: false
      # Format drift fails the build.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      - name: gofmt -l AEP-CAW
        run: |
          out=$(gofmt -l AEP-CAW)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt reports drift"
            exit 1
          fi

  clippy:
    name: cargo clippy --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The lint levels live in the workspace lints table of the root Cargo.toml.
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings

  vectors-without-rust:
    name: conformance vectors, example third-party runner without Rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: run the vectors with no Rust toolchain on PATH
        run: |
          NODE_DIR="$(dirname "$(command -v node)")"
          env -i PATH="$NODE_DIR:/usr/bin:/bin" HOME="$HOME" sh -ec '
            if command -v cargo || command -v rustc; then
              echo "a Rust toolchain is on PATH"
              exit 1
            fi
            node AEP-Components/conformance/vectors/examples/third-party-runner/run-vectors.mjs \
              --require dock-socket,dock-request,dock-answer,mesh-mode --json
          '

  caw:
    name: AEP-CAW go test, race and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: AEP-CAW
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: AEP-CAW/go.mod
          cache-dependency-path: AEP-CAW/go.sum
      - name: install build deps
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev libfuse3-dev libseccomp-dev pkg-config
      - name: free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell
      # scripts/ci-go-test.sh turns each failing test into an error annotation, which
      # the checks API serves to readers that cannot fetch the job log.
      # t.TempDir follows GOTMPDIR. Tests bind Unix sockets under it and a socket path
      # holds at most 108 bytes, so the runner temp path is too long. /tmp/go-tmp keeps
      # the longest test socket path near 96 bytes.
      - name: go test ./...
        run: |
          mkdir -p "$GOTMPDIR"
          bash scripts/ci-go-test.sh -p 2 ./...
        env:
          GOTMPDIR: /tmp/go-tmp
      - name: go test -race ./...
        run: |
          mkdir -p "$GOTMPDIR"
          bash scripts/ci-go-test.sh -race -p 2 ./...
        env:
          GOTMPDIR: /tmp/go-tmp
      # AEP-CRV-040: with the shipped server config and the default policy a
      # denied file read and a denied connect each fail with one deny event.
      # The eBPF network backend needs root, so this step runs the test under
      # sudo. AEP_CAW_ENFORCEMENT_TEST=1 turns a missing precondition into a
      # failure, so the step cannot pass by skipping.
      - name: shipped config enforcement (root)
        run: |
          mkdir -p "$GOTMPDIR"
          sudo -E env "PATH=$PATH" AEP_CAW_ENFORCEMENT_TEST=1 \
            go test -count=1 -run '^TestShippedConfigEnforcesDefaultPolicy$' -v ./internal/server/
        env:
          GOTMPDIR: /tmp/go-tmp
      - name: conformance vectors (Go CAW)
        run: go test -run Vectors -v ./internal/kerneldock
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: AEP-CAW
