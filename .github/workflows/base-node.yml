name: base-node

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: cargo test -p aep-base-node --lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test -p aep-base-node --lib
        run: cargo test -p aep-base-node --lib

  probe:
    name: aep-base-node --health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build -p aep-base-node --bin aep-base-node
        run: cargo build -p aep-base-node --bin aep-base-node
      # The workspace target dir is rust/target (see .cargo/config.toml).
      # No dock binds and no daemon starts, so exit 1 for degraded is expected.
      - name: aep-base-node --health
        run: |
          set +e
          ./rust/target/debug/aep-base-node --health > /tmp/health.json
          code=$?
          set -e
          echo "exit code ${code}"
          if [ "${code}" != "0" ] && [ "${code}" != "1" ]; then
            cat /tmp/health.json
            exit 1
          fi
      - name: health JSON carries the rollup
        run: |
          jq -e ".status == \"ok\" or .status == \"degraded\" or .status == \"error\"" /tmp/health.json
          jq -e "has(\"sqlite_closed\")" /tmp/health.json
          jq -r "\"status \" + .status + \" sqlite_closed \" + (.sqlite_closed | tostring)" /tmp/health.json
      - name: Display API folder is absent
        run: test ! -d AEP-Components/display-api

  self-test:
    name: aep-base-node --self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build -p aep-base-node --bin aep-base-node
        run: cargo build -p aep-base-node --bin aep-base-node
      - name: aep-base-node --self-test
        run: ./rust/target/debug/aep-base-node --self-test
