# AEP 2.9 workspace build output directory.

[build]
target-dir = "rust/target"

# EDE-SPEED-001: debug and test builds optimize at level 1. The proof tests of the kernel
# are compute bound: on the 4 vCPU host memory_verdict_identity took 223 s at level 0 and
# 53 s at level 1, redteam_multistep 75 s and 14 s, for about the same cold build time.
# Debug assertions and overflow checks remain on, so every check of a debug build remains.
# Debug info holds line tables only: backtraces and panics keep file and line, while the
# build writes and links far less, which shortens every rebuild.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

# EDE-SPEED-001: the release build with incremental compile data, for the quick
# conformance check of a draft only (AEP_CONFORMANCE_PROFILE=release-quick). It builds
# into its own folder, so it never replaces the release build. The full check before a
# change lands and the GitHub workflow test the release build itself.
[profile.release-quick]
inherits = "release"
incremental = true
