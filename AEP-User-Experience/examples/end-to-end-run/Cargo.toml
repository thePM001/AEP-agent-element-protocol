[package]
name = "aep-end-to-end-run"
version = "2.9.0"
edition = "2021"
license = "Apache-2.0"
description = "AEP 2.9 end to end run. One command walks every layer twice: the refuse path first and the pass path second."
publish = false

[dependencies]
aep-base-node = { path = "../../../AEP-Base-Node/AEP-Crate" }
aep-base-node-pulse = { path = "../../../AEP-Components/base-node-pulse/crate" }
aep-caw-runtime = { path = "../../../AEP-CAWs-RustGvisor/aep-caw-runtime" }
aep-envelope = { path = "../../../AEP-Components/envelope/crate" }
aep-lattice-crypto = { path = "../../../AEP-Components/lattice-crypto/crate" }
# The run signs the task manifest of its attach agent the way the dock gateway checks it.
aep-ucb = { path = "../../../AEP-Base-Node/AEP-Docks/ucb/crate" }
aep-ucb-perimeter-v1 = { path = "../../../AEP-Base-Node/AEP-Docks/ucb/perimeter-v1" }
hex.workspace = true
serde_json = "1"

[lints]
workspace = true
