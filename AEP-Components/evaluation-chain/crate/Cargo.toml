[package]
name = "aep-evaluation-chain"
version = "0.1.0"
edition = "2021"
description = "AEP 2.8 evaluation chain meet. All 15 walls. Collect-all. No skip on live admit."
license = "Apache-2.0"
publish = false

[dependencies]
# The one admit result shape that this derived ledger reads.
aep-kernel-types = { path = "../../kernel-types/crate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
