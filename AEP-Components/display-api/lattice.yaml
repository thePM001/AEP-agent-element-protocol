aep_version: "2.8.6"
dynaep_version: "1.0.0"
lattice_revision: 1
actions:
  root:ping:
    label: ping
    category: system_event
    wrap: kernel
    parents: []
    children:
      - action:write
      - display-api:attach
    constraints: []
    agent_permission: []
  action:write:
    label: write
    category: agent_action
    wrap: kernel
    parents:
      - root:ping
    children: []
    constraints: []
    agent_permission:
      - agent-a
      - display-client
  display-api:attach:
    label: Attach to the display API
    category: agent_action
    wrap: display-api
    parents:
      - root:ping
    children:
      - display-api:source:ingest
      - display-api:view:request
      - display-api:catalog:list
    constraints: []
    agent_permission:
      - agent-a
      - display-client
  display-api:source:ingest:
    label: Ingest a named display source
    category: agent_action
    wrap: display-api
    parents:
      - display-api:attach
    children:
      - display-api:sector:stage
    constraints: []
    agent_permission:
      - agent-a
      - display-client
  display-api:sector:stage:
    label: Stage a named display sector
    category: agent_action
    wrap: display-api
    parents:
      - display-api:source:ingest
    children:
      - display-api:view:project
    constraints: []
    agent_permission:
      - agent-a
      - display-client
  display-api:view:request:
    label: Request a named display view
    category: agent_action
    wrap: display-api
    parents:
      - display-api:attach
    children:
      - display-api:view:project
    constraints: []
    agent_permission:
      - agent-a
      - display-client
  display-api:view:project:
    label: Project a named display view
    category: output
    wrap: display-api
    parents:
      - display-api:view:request
      - display-api:sector:stage
    children: []
    constraints: []
    agent_permission:
      - agent-a
      - display-client
  display-api:catalog:list:
    label: List loaded display views sources and sectors
    category: output
    wrap: display-api
    parents:
      - display-api:attach
    children: []
    constraints: []
    agent_permission:
      - agent-a
      - display-client

display_views:
  view.alpha:
    source: source.alpha
    sector: sector.one
  view.beta:
    source: source.alpha
    sector: sector.two
display_sources:
  - id: source.alpha
    locator: source.alpha.json
    sectors:
      - sector.one
      - sector.two
  - id: source.beta
    locator: source.beta.json
display_sectors:
  - sector.one
  - sector.two
