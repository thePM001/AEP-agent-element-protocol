[package]
name = "aep-one-live-evaluation"
version = "0.1.0"
edition = "2021"
description = "One live evaluation. One Admit function judges the opened frame."
license = "UNLICENSED"
publish = false

[dependencies]
aep-admit-live-dock = { path = "../../admit-live-dock/crate" }
