[package]
name = "aep-dock-line-reader"
version = "0.1.0"
edition = "2021"
description = "Dock line reader must not read one byte per await up to 4MiB."
license = "UNLICENSED"
publish = false

[dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }

[dev-dependencies]
# The source gate in tests/source_gate.rs reads the dock through the one source check.
aep-source-check = { path = "../../source-check/crate" }

[lints]
workspace = true
