[package]
name = "aep-dock-line-reader"
version = "0.1.0"
edition = "2021"
description = "Dock line reader must not read one byte per await up to 4MiB."
license = "UNLICENSED"
publish = false

[[bin]]
name = "aep-dock-line-reader"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
