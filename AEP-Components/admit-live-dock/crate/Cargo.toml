[package]
name = "aep-admit-live-dock"
version = "0.1.0"
edition = "2021"
description = "Fold product Admit wall crates into envelope_admit collect-all. The earlier law change removed the CI wall inventory binary."
license = "UNLICENSED"
publish = false


[dependencies]
aep-admit = { path = "../../admit/crate" }
aep-admit-writing-walls = { path = "../../admit-writing-walls/crate" }
aep-admit-channel-order-walls = { path = "../../admit-channel-order-walls/crate" }
aep-admit-temporal-bounds = { path = "../../admit-temporal-bounds/crate" }
aep-admit-budget-window = { path = "../../admit-budget-window/crate" }
aep-envelope-walls = { path = "../../envelope-walls/crate" }
aep-live-entry = { path = "../../live-entry/crate" }
serde_json = "1"
aep-policy-system-admit = { path = "../../policy-system-admit/crate" }

[dev-dependencies]
# Two tests read compile_live_walls_in_view through the one source check.
aep-source-check = { path = "../../source-check/crate" }

[lints]
workspace = true
