[package]
name = "aep-lattice-gated-fetch"
version = "0.1.0"
edition = "2021"
description = "After dock allow lattice-gated-fetch must not fall through to ordinary fetch."
license = "UNLICENSED"
publish = false

[[bin]]
name = "aep-lattice-gated-fetch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
