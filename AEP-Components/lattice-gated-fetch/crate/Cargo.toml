[package]
name = "aep-lattice-gated-fetch"
version = "0.1.0"
edition = "2021"
description = "The kernel outbound request of the one granted gateway path, with the operator route list, pinned addresses and a bounded reply."
license = "UNLICENSED"
publish = false

[dependencies]
aep-egress-address = { path = "../../egress-address/crate" }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

[dev-dependencies]
# The source gate in tests/source_gate.rs reads the docking module through the one source check.
aep-source-check = { path = "../../source-check/crate" }

[lints]
workspace = true
