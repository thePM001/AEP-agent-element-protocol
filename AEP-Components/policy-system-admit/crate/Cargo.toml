[package]
name = "aep-policy-system-admit"
version = "0.1.0"
edition = "2021"
description = "the earlier law change. Load AEP-Policy-System GAP files as live Admit walls bound to wrap or prefix."
license = "UNLICENSED"
publish = false

[[bin]]
name = "aep-policy-system-admit"
path = "src/main.rs"

[dependencies]
aep-admit = { path = "../../admit/crate" }
gap-schema-profile-v13 = { path = "../../gap-schema-profile-v13/crate" }
anyhow = "1"
serde_json = "1"
aep-ucm-core = { path = "../../ucm/crates/ucm-core" }
aep-ucm-receipt = { path = "../../ucm/crates/ucm-receipt" }

[dev-dependencies]
aep-lattice-crypto = { path = "../../lattice-crypto/crate" }

[lints]
workspace = true
