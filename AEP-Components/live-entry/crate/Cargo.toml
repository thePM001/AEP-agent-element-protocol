# @PAD: aep-live-entry-cargo-v1
# @GCDE: gaplune.policy.v1
[package]
name = "aep-live-entry"
version = "0.1.0"
edition = "2021"
description = "AEP28-ENV-036 Rust live entry with in-process aep_envelope admit, YAML load, structural apply and ID mint, while a template target still meets Admit."
license = "UNLICENSED"
publish = false

[[bin]]
name = "aep-live-entry"
path = "src/main.rs"

[dependencies]
aep-envelope = { path = "../../envelope/crate" }
anyhow = "1"
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
