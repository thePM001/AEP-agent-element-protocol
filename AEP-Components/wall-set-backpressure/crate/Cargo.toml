[package]
name = "aep-wall-set-backpressure"
version = "0.1.0"
edition = "2021"
description = "the earlier law change plus. Dock Deny returns closed-wall ids, class and mechanical repair. Writing walls stay protocol law at priority 255."
license = "UNLICENSED"
publish = false

[[bin]]
name = "aep-wall-set-backpressure"
path = "src/main.rs"

[dependencies]
aep-kernel-types = { path = "../../kernel-types/crate" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
