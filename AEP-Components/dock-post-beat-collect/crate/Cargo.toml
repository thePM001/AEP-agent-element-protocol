[package]
name = "aep-dock-post-beat-collect"
version = "0.1.0"
edition = "2021"
description = "Dock client collects post-beat Admit by digest. DenyReport.closed and allow event_id return on the wire."
license = "UNLICENSED"
publish = false

[dependencies]
# The one owner of the pulse constant.
aep-kernel-types = { path = "../../kernel-types/crate" }

[dev-dependencies]
# The source gate in tests/source_gate.rs reads the dock and UCB through the one source check.
aep-source-check = { path = "../../source-check/crate" }

[lints]
workspace = true
