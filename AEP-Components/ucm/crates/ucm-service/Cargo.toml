[package]
name = "aep-ucm"
description = "AEP UCM service: CLI, loopback HTTP API, MCP over HTTP and stdio, receipt store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "aep-ucm"
path = "src/main.rs"

[dependencies]
aep-ucm-core = { path = "../ucm-core" }
aep-ucm-receipt = { path = "../ucm-receipt" }
aep-ucm-lookup = { path = "../ucm-lookup" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "io-std", "signal", "sync", "time"] }
axum.workspace = true
reqwest.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hex.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
